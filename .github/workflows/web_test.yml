name: web-test

# Runs the web/ vitest suite (currently the budget-config drift guard that
# pins MONTHLY_CAP_USD / STAGE_CAPS_USD against scraper/budget.py). These
# tests previously only ran locally — open item #1 in HANDOFF.md.
#
# Path-filtered to web/ so unrelated scraper-only pushes don't spin a Node
# runner. No secrets required: the suite is pure constant-drift checking and
# touches neither Supabase nor Anthropic.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web_test.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web_test.yml"

permissions:
  contents: read

concurrency:
  group: web-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run vitest
        working-directory: web
        run: npm test
