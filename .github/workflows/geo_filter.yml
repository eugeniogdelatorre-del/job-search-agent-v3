name: geo_filter

# Daily at 06:00 UTC (= 03:00 ART). Runs AFTER the 04:00 UTC scrape.
# Uses Claude Haiku 4.5 Batch API to mark location-ineligible jobs inactive.
# cv_score.yml fires an hour later at 07:00 UTC, only scoring jobs that passed.
#
# The filter reads the active CV to learn the candidate's city/country.
# Jobs that are on-site/hybrid outside that city, or remote restricted to
# regions that exclude the candidate, are set is_active=false + geo_filtered=true.
# Jobs that pass are marked geo_filtered=true (is_active unchanged).
#
# Hard kill if MTD spend > $8 (scraper/budget.py). 55-min timeout matches
# the 50-min Anthropic Batch poll cap + 5-min slack.
# concurrency.cancel-in-progress=false to avoid orphaning an in-flight Batch poll.

on:
  # Audit H4: triggered by classify completion instead of a 06:00 UTC cron.
  # Eliminates the race where classify overruns past 06:00 and geo_filter
  # picks up rows with NULL remote_status.
  workflow_run:
    workflows: ["classify"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      # Audit M22: typed number.
      limit:
        description: "Optional: cap jobs per run (default 1000)"
        required: false
        type: number

permissions:
  contents: read

concurrency:
  # Audit H2: shared with pipeline.yml's geo-filter job.
  group: stage-geo_filter
  cancel-in-progress: false

jobs:
  geo_filter:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      # Audit H6: fail fast on missing secrets.
      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_URL:-}" ]         && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_SERVICE_KEY:-}" ] && missing+=("SUPABASE_SERVICE_KEY")
          [ -z "${ANTHROPIC_API_KEY:-}" ]    && missing+=("ANTHROPIC_API_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi
          echo "All required secrets present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run geo_filter
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Operator decision (2026-05-13): kept as ``vars.`` since the
          # candidate city isn't considered sensitive. If that ever
          # changes, swap the prefix to ``secrets.`` — the Python side
          # reads via ``os.environ`` either way.
          CANDIDATE_LOCATION: ${{ vars.CANDIDATE_LOCATION }}
          # Quoted as data via env var — never interpolate ${{ inputs.* }}
          # directly into a `run:` block. See SECURITY note in repo audit.
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT_INPUT" ]; then
            python scraper/geo_filter.py --limit "$LIMIT_INPUT"
          else
            python scraper/geo_filter.py
          fi

  notify_on_failure:
    needs: [geo_filter]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scraper/notify.py
