name: weekly_summary

# Sundays 22:00 UTC == Sun 7pm ART (UTC-3). No AI involved — just a
# SQL pull + Resend POST (see scraper/weekly_summary.py). Resend free
# tier is 3000 emails/month so this is effectively free.
#
# No concurrency group needed; one send per week, and workflow_dispatch
# is safe to re-run (idempotent from the user's inbox perspective — two
# copies of the same roundup is harmless).

on:
  # Paused 2026-05-17 alongside the scrape/AI chain — operator is out
  # of Anthropic credit until end of May. weekly_summary does NOT use
  # Anthropic credit (Resend only), but with no new scored jobs landing
  # while the pipeline is paused, the digest would be stale/duplicated.
  # Re-enabling alongside scrape.yml when credit returns.
  # To resume: uncomment the two `schedule` / `cron` lines below.
  #   schedule:
  #     - cron: "0 22 * * 0"
  workflow_dispatch:
    inputs:
      # Audit M22: typed boolean — fixes the previous string `== "true"`
      # comparison that silently ignored "True"/"TRUE"/"1".
      dry:
        description: "Print HTML without sending"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Send weekly summary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
          # Quoted as data via env var — never interpolate ${{ inputs.* }}
          # directly into a `run:` block. See SECURITY note in repo audit.
          DRY_INPUT: ${{ github.event.inputs.dry }}
        run: |
          if [ "$DRY_INPUT" = "true" ]; then
            python scraper/weekly_summary.py --dry
          else
            python scraper/weekly_summary.py
          fi

  notify_on_failure:
    needs: [send]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scraper/notify.py
