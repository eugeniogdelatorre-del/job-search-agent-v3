name: classify

# Daily at 05:00 UTC (= 02:00 ART). Runs AFTER the 04:00 UTC scrape and
# BEFORE the 06:00 UTC geo_filter. Classifies new jobs (function_category,
# seniority, vertical, remote_status) via Claude Haiku 4.5 Batch API.
# geo_filter.yml needs remote_status populated before it runs — this ordering
# ensures that. cv_score.yml fires at 07:00 UTC.
#
# Hard kill if MTD spend > $8 (scraper/budget.py). 55-min timeout matches
# the 50-min Anthropic Batch poll cap (DEFAULT_POLL_MAX_SECONDS in
# _anthropic_batch.py) plus 5-min slack for write-back and pip cache miss.
# concurrency.cancel-in-progress=false so a workflow_dispatch doesn't
# orphan a running Batch poll.

on:
  # Audit H4: dependency-based, not time-based. Fires when scrape completes
  # so an overrun no longer cascades into a half-finished classify. The
  # job's `if:` guards on workflow_run.conclusion=='success' so a failed
  # scrape doesn't trigger downstream spend.
  workflow_run:
    workflows: ["scrape"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      # Audit M22: typed number so a typo'd "foo" fails at submit, not
      # deep inside argparse.
      limit:
        description: "Optional: cap jobs per run (default 500)"
        required: false
        type: number

permissions:
  contents: read

concurrency:
  # Audit H2: shared with pipeline.yml's classify job to prevent
  # concurrent Anthropic Batch submissions for the same stage.
  group: stage-classify
  cancel-in-progress: false

jobs:
  classify:
    # On a workflow_run trigger, only run if scrape actually succeeded.
    # workflow_dispatch always runs (manual override).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      # Audit H6: fail fast on missing secrets.
      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_URL:-}" ]         && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_SERVICE_KEY:-}" ] && missing+=("SUPABASE_SERVICE_KEY")
          [ -z "${ANTHROPIC_API_KEY:-}" ]    && missing+=("ANTHROPIC_API_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi
          echo "All required secrets present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run classify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Quoted as data via env var — never interpolate ${{ inputs.* }}
          # directly into a `run:` block. See SECURITY note in repo audit.
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT_INPUT" ]; then
            python scraper/classify.py --limit "$LIMIT_INPUT"
          else
            python scraper/classify.py
          fi

  notify_on_failure:
    needs: [classify]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scraper/notify.py
