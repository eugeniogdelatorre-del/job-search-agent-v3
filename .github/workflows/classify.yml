name: classify

# Daily at 05:00 UTC (= 02:00 ART). Runs AFTER the 04:00 UTC scrape and
# BEFORE the 06:00 UTC geo_filter. Classifies new jobs (function_category,
# seniority, vertical, remote_status) via Claude Haiku 4.5 Batch API.
# geo_filter.yml needs remote_status populated before it runs — this ordering
# ensures that. cv_score.yml fires at 07:00 UTC.
#
# Hard kill if MTD spend > $8 (scraper/budget.py). 55-min timeout matches
# the 50-min Anthropic Batch poll cap (DEFAULT_POLL_MAX_SECONDS in
# _anthropic_batch.py) plus 5-min slack for write-back and pip cache miss.
# concurrency.cancel-in-progress=false so a workflow_dispatch doesn't
# orphan a running Batch poll.

on:
  # Resumed 2026-05-07. Fires after the 04:00 UTC scrape, before the
  # 06:00 UTC geo_filter — gives scrape ~55 min headroom.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional: cap jobs per run (default 500)"
        required: false
        default: ""

concurrency:
  group: classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run classify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python scraper/classify.py --limit ${{ github.event.inputs.limit }}
          else
            python scraper/classify.py
          fi
