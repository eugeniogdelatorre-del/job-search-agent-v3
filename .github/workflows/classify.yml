name: classify

# Daily at 06:00 UTC (= 03:00 ART). Classifies new jobs via Claude Haiku
# 4.5 Batch API — 50% off base rates. Runs AFTER the final 00:00 UTC
# scrape of the night, so fresh jobs get classified in the morning run.
# cv_score.yml fires an hour later at 07:00 UTC, picking up whatever
# this run classified.
#
# Hard kill if MTD spend > $8 (scraper/budget.py). 30-min timeout gives
# the Batch API plenty of slack — typical runs complete in <5 min.
# concurrency.cancel-in-progress=false so a workflow_dispatch doesn't
# orphan a running Batch poll (batches still complete server-side even
# if we cancel the poll, but the write-back step would be skipped).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional: cap jobs per run (default 500)"
        required: false
        default: ""

concurrency:
  group: classify
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run classify
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python scraper/classify.py --limit ${{ github.event.inputs.limit }}
          else
            python scraper/classify.py
          fi
