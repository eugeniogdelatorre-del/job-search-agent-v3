name: scrape

# Once-daily at 04:00 UTC (= 01:00 ART). Runs all sources in a single job.
# geo_filter.yml fires at 06:00 UTC and cv_score.yml at 07:00 UTC.
# workflow_dispatch keeps an optional 'group' input for debugging partial runs.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      group:
        description: "Optional: scrape only this group (1 or 2). Blank = all sources."
        required: false
        default: ""

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.group }}" ]; then
            python scraper/scrape.py --group ${{ github.event.inputs.group }}
          else
            python scraper/scrape.py
          fi
