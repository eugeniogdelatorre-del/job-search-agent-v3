name: cv_score

# Daily at 07:00 UTC (= 04:00 ART). Runs an hour after classify.yml so
# fresh jobs from the overnight scrape have function_category / seniority
# / vertical populated before we score them against the CV. Scores only
# warm jobs (rule-based score_total >= 60) against the currently active
# resume, skipping anything already scored.
#
# Batch API + prompt caching on the CV — see scraper/cv_score.py docstring.
# Hard kill if MTD spend > $8 (scraper/budget.py). 55-min timeout matches
# the 50-min Anthropic Batch poll cap + 5-min slack.
# concurrency.cancel-in-progress=false to avoid orphaning an in-flight
# Batch poll on overlapping dispatches.

on:
  # Audit H4: triggered by geo_filter completion. No standalone cron — the
  # whole chain rides on scrape's 04:00 UTC cron and propagates forward.
  workflow_run:
    workflows: ["geo_filter"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      # Audit M22: typed number.
      limit:
        description: "Optional: cap jobs per run (default 500)"
        required: false
        type: number

permissions:
  contents: read

concurrency:
  # Audit H2: shared with pipeline.yml's cv-score job.
  group: stage-cv_score
  cancel-in-progress: false

jobs:
  cv_score:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4

      # Audit H6: pre-flight check so missing secrets fail loudly at
      # step 1 with a clear list, not deep inside Python with a cryptic
      # traceback. `set -euo pipefail` + explicit `if/then` avoids the
      # brittle `&& ... || true` pattern of the previous version.
      - name: Check required secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "${SUPABASE_URL:-}" ]         && missing+=("SUPABASE_URL")
          [ -z "${SUPABASE_SERVICE_KEY:-}" ] && missing+=("SUPABASE_SERVICE_KEY")
          [ -z "${ANTHROPIC_API_KEY:-}" ]    && missing+=("ANTHROPIC_API_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}" >&2
            echo "Add them at: repo > Settings > Secrets and variables > Actions" >&2
            exit 1
          fi
          echo "All required secrets present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run cv_score
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Quoted as data via env var — never interpolate ${{ inputs.* }}
          # directly into a `run:` block. See SECURITY note in repo audit.
          LIMIT_INPUT: ${{ github.event.inputs.limit }}
        run: |
          if [ -n "$LIMIT_INPUT" ]; then
            python scraper/cv_score.py --limit "$LIMIT_INPUT"
          else
            python scraper/cv_score.py
          fi

  notify_on_failure:
    needs: [cv_score]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scraper/notify.py
