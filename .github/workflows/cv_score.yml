name: cv_score

# Daily at 07:00 UTC (= 04:00 ART). Runs an hour after classify.yml so
# fresh jobs from the overnight scrape have function_category / seniority
# / vertical populated before we score them against the CV. Scores only
# warm jobs (rule-based score_total >= 60) against the currently active
# resume, skipping anything already scored.
#
# Batch API + prompt caching on the CV — see scraper/cv_score.py docstring.
# Hard kill if MTD spend > $8 (scraper/budget.py). 30-min timeout fits the
# typical <5 min Batch turnaround with ample slack.
# concurrency.cancel-in-progress=false to avoid orphaning an in-flight
# Batch poll on overlapping dispatches.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional: cap jobs per run (default 500)"
        required: false
        default: ""

concurrency:
  group: cv_score
  cancel-in-progress: false

jobs:
  cv_score:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          ok=true
          [ -z "$SUPABASE_URL" ]       && echo "❌ SUPABASE_URL is not set"       && ok=false || echo "✅ SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_KEY" ] && echo "❌ SUPABASE_SERVICE_KEY is not set" && ok=false || echo "✅ SUPABASE_SERVICE_KEY"
          [ -z "$ANTHROPIC_API_KEY" ]  && echo "❌ ANTHROPIC_API_KEY is not set"  && ok=false || echo "✅ ANTHROPIC_API_KEY"
          [ "$ok" = "false" ] && echo "" && echo "Add missing secrets at: repo → Settings → Secrets and variables → Actions" && exit 1 || true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run cv_score
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python scraper/cv_score.py --limit ${{ github.event.inputs.limit }}
          else
            python scraper/cv_score.py
          fi
