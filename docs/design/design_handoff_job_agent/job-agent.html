// ─── MATCH BADGE ─────────────────────────────────────────────────────────────
function MatchBadge({ match }) {
  if (match === null) return (
    <span style={{
      fontFamily: 'var(--font-mono)', fontSize: 11, fontStyle: 'italic',
      color: '#3A4460', background: '#141820',
      border: '1px solid #1E2330',
      padding: '2px 8px', borderRadius: 20,
    }}>—</span>
  );

  const color = match >= 85 ? 'var(--accent-cyan)' : match >= 70 ? '#67E8F9' : 'var(--text-mid)';
  const bg = match >= 85 ? 'rgba(0,212,255,0.12)' : match >= 70 ? 'rgba(103,232,249,0.08)' : 'rgba(160,170,187,0.08)';
  const border = match >= 85 ? 'rgba(0,212,255,0.4)' : match >= 70 ? 'rgba(103,232,249,0.3)' : 'rgba(160,170,187,0.2)';

  return (
    <span style={{
      fontFamily: 'var(--font-mono)', fontSize: 11, fontWeight: 600,
      color, background: bg, border: `1px solid ${border}`,
      padding: '2px 8px', borderRadius: 20,
    }}>{match}%</span>
  );
}

function RuleBadge({ score }) {
  const color = score >= 70 ? 'var(--accent-amber)' : score >= 50 ? 'var(--text-mid)' : '#3A4460';
  const bg = score >= 70 ? 'rgba(245,166,35,0.10)' : score >= 50 ? 'rgba(160,170,187,0.07)' : 'transparent';
  const border = score >= 70 ? 'rgba(245,166,35,0.3)' : score >= 50 ? 'rgba(160,170,187,0.2)' : 'var(--border)';
  return (
    <span style={{
      fontFamily: 'var(--font-mono)', fontSize: 10, fontWeight: 500,
      color, background: bg, border: `1px solid ${border}`,
      padding: '2px 7px', borderRadius: 4,
    }}>rule: {score}</span>
  );
}

// ─── TAG PILL ─────────────────────────────────────────────────────────────────
function TagPill({ tag }) {
  const s = tagStyle(tag);
  return (
    <span style={{
      fontFamily: 'var(--font-body)', fontSize: 10, fontWeight: 500,
      color: s.text, background: s.bg, border: `1px solid ${s.border}`,
      padding: '2px 8px', borderRadius: 20, whiteSpace: 'nowrap',
    }}>{tag}</span>
  );
}

// ─── JOB CARD ─────────────────────────────────────────────────────────────────
function JobCard({ job, accentColor, cardRadius }) {
  const [hovered, setHovered] = useState(false);
  const [saved, setSaved] = useState(job.saved);
  const [applied, setApplied] = useState(false);

  const cardStyle = {
    background: 'var(--bg-card)',
    border: `1px solid ${hovered ? `rgba(0,212,255,0.35)` : 'var(--border)'}`,
    borderRadius: cardRadius || 10,
    padding: '16px',
    display: 'flex', flexDirection: 'column', gap: 10,
    transition: 'border-color 0.18s, box-shadow 0.18s, transform 0.18s',
    boxShadow: hovered ? '0 0 0 1px rgba(0,212,255,0.1), 0 4px 24px rgba(0,212,255,0.06)' : 'none',
    transform: hovered ? 'translateY(-1px)' : 'none',
    cursor: 'default',
    position: 'relative',
    overflow: 'hidden',
  };

  return (
    <div style={cardStyle}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}>

      {/* Subtle top accent line on hover */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, height: 1,
        background: hovered ? `linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent)` : 'transparent',
        transition: 'background 0.3s',
      }}></div>

      {/* Row 1: Title + Match */}
      <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 8 }}>
        <h3 style={{
          fontFamily: 'var(--font-heading)', fontSize: 14, fontWeight: 700,
          color: 'var(--text-primary)', letterSpacing: '-0.02em', lineHeight: 1.3,
          flex: 1, overflow: 'hidden', display: '-webkit-box',
          WebkitLineClamp: 2, WebkitBoxOrient: 'vertical',
        }}>{job.title}</h3>
        <MatchBadge match={job.match} />
      </div>

      {/* Row 2: Company · Location */}
      <div style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: 'var(--text-muted)', display: 'flex', gap: 6, alignItems: 'center' }}>
        <span style={{ color: 'var(--text-mid)', fontWeight: 500 }}>{job.company}</span>
        <span style={{ color: 'var(--border-mid)' }}>·</span>
        <span>{job.location}</span>
      </div>

      {/* Row 3: Tags + Rule score */}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, alignItems: 'center' }}>
        {job.tags.map(t => <TagPill key={t} tag={t} />)}
        <RuleBadge score={job.ruleScore} />
      </div>

      {/* Row 4: Salary */}
      <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: '#3A4460', letterSpacing: '0.02em' }}>
        {job.salary}
      </div>

      {/* Row 5: Bottom bar */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: 2 }}>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: '#3A4460', letterSpacing: '0.02em' }}>
          {job.posted} · via {job.source}
        </span>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          {/* Bookmark */}
          <button onClick={() => setSaved(s => !s)} style={{
            background: 'none', border: 'none', padding: 4, cursor: 'pointer',
            color: saved ? 'var(--accent-amber)' : 'var(--text-muted)',
            transition: 'color 0.15s',
          }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill={saved ? 'currentColor' : 'none'}>
              <path d="M2.5 1.5h9a.5.5 0 01.5.5v10.5l-5-3-5 3V2a.5.5 0 01.5-.5z"
                stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/>
            </svg>
          </button>
          {/* Apply */}
          <button onClick={() => setApplied(a => !a)} style={{
            background: applied ? 'rgba(0,212,255,0.15)' : accentColor === 'amber' ? 'rgba(245,166,35,0.9)' : 'var(--accent-cyan)',
            border: applied ? '1px solid rgba(0,212,255,0.4)' : 'none',
            borderRadius: 5, padding: '5px 12px',
            fontFamily: 'var(--font-mono)', fontSize: 10, fontWeight: 600,
            color: applied ? 'var(--accent-cyan)' : '#000',
            cursor: 'pointer', letterSpacing: '0.03em',
            transition: 'transform 0.15s, background 0.15s',
            transform: hovered && !applied ? 'scale(1.03)' : 'scale(1)',
          }}>
            {applied ? 'applied ✓' : 'apply →'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── STATS ROW ────────────────────────────────────────────────────────────────
function StatsRow({ jobs }) {
  const scored = jobs.filter(j => j.match !== null);
  const avgMatch = scored.length ? Math.round(scored.reduce((a, j) => a + j.match, 0) / scored.length) : 0;
  const highRule = jobs.filter(j => j.ruleScore >= 70).length;

  const stats = [
    { label: 'indexed', value: jobs.length },
    { label: 'scored', value: scored.length },
    { label: 'avg match', value: scored.length ? `${avgMatch}%` : '—' },
    { label: 'rule ≥ 70', value: highRule },
    { label: 'saved', value: jobs.filter(j => j.saved).length },
  ];

  return (
    <div style={{ display: 'flex', gap: 0, marginBottom: 24, border: '1px solid var(--border)', borderRadius: 8, overflow: 'hidden', background: 'var(--bg-card)' }}>
      {stats.map((s, i) => (
        <div key={s.label} style={{
          flex: 1, padding: '10px 16px', textAlign: 'center',
          borderRight: i < stats.length - 1 ? '1px solid var(--border)' : 'none',
        }}>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 18, fontWeight: 600, color: 'var(--text-primary)', letterSpacing: '-0.02em' }}>
            {s.value}
          </div>
          <div style={{ fontFamily: 'var(--font-mono)', fontSize: 9, color: 'var(--text-muted)', marginTop: 2, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
            {s.label}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── SETTINGS PAGE ────────────────────────────────────────────────────────────
function SettingsPage() {
  const chartPoints = [12, 18, 14, 22, 28, 24, 30, 26, 34, 28, 38, 32, 42, 36, 40, 44, 38, 46, 42, 48, 44, 52, 48, 56, 50, 58, 52, 60, 56, 62];
  const max = Math.max(...chartPoints);
  const w = 500, h = 120, pad = 10;
  const pts = chartPoints.map((v, i) => {
    const x = pad + (i / (chartPoints.length - 1)) * (w - 2 * pad);
    const y = h - pad - (v / max) * (h - 2 * pad);
    return `${x},${y}`;
  }).join(' ');
  const area = `M${pad},${h - pad} ` + chartPoints.map((v, i) => {
    const x = pad + (i / (chartPoints.length - 1)) * (w - 2 * pad);
    const y = h - pad - (v / max) * (h - 2 * pad);
    return `L${x},${y}`;
  }).join(' ') + ` L${w - pad},${h - pad} Z`;

  const sources = [
    { name: 'Greenhouse', status: 'healthy', jobs: 312, latency: '1.2s' },
    { name: 'Lever', status: 'healthy', jobs: 248, latency: '0.8s' },
    { name: 'Ashby', status: 'degraded', jobs: 94, latency: '3.4s' },
    { name: 'Workable', status: 'healthy', jobs: 67, latency: '1.1s' },
  ];

  const statusColor = { healthy: '#4ADE80', degraded: 'var(--accent-amber)', down: '#F87171' };

  return (
    <div style={{ padding: '32px 24px', maxWidth: 800 }}>
      <h1 style={{ fontFamily: 'var(--font-heading)', fontSize: 32, fontWeight: 800, color: 'var(--text-primary)', letterSpacing: '-0.04em', marginBottom: 28 }}>Settings</h1>
      
      <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 10, padding: 20, marginBottom: 16 }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-muted)', marginBottom: 12, textTransform: 'uppercase', letterSpacing: '0.08em' }}>MTD Spend · API calls</div>
        <svg width="100%" viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: 'block' }}>
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor="var(--accent-cyan)" stopOpacity="0.2"/>
              <stop offset="100%" stopColor="var(--accent-cyan)" stopOpacity="0"/>
            </linearGradient>
          </defs>
          <path d={area} fill="url(#areaGrad)"/>
          <polyline points={pts} fill="none" stroke="var(--accent-cyan)" strokeWidth="1.5" strokeLinejoin="round"/>
        </svg>
      </div>

      <div style={{ background: 'var(--bg-card)', border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden' }}>
        <div style={{ padding: '12px 16px', borderBottom: '1px solid var(--border)', fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '0.08em' }}>Source Health</div>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ borderBottom: '1px solid var(--border)' }}>
              {['Source', 'Status', 'Jobs today', 'Latency'].map(h => (
                <th key={h} style={{ padding: '10px 16px', textAlign: 'left', fontFamily: 'var(--font-mono)', fontSize: 10, color: '#3A4460', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 500 }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {sources.map((s, i) => (
              <tr key={s.name} style={{ borderBottom: i < sources.length - 1 ? '1px solid var(--border)' : 'none' }}>
                <td style={{ padding: '10px 16px', fontFamily: 'var(--font-body)', fontSize: 13, color: 'var(--text-primary)' }}>{s.name}</td>
                <td style={{ padding: '10px 16px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <div style={{ width: 6, height: 6, borderRadius: '50%', background: statusColor[s.status] }}></div>
                    <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, color: statusColor[s.status] }}>{s.status}</span>
                  </div>
                </td>
                <td style={{ padding: '10px 16px', fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-mid)' }}>{s.jobs}</td>
                <td style={{ padding: '10px 16px', fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-muted)' }}>{s.latency}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

            {cv.active
              ? <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--accent-cyan)', background: 'rgba(0,212,255,0.1)', border: '1px solid rgba(0,212,255,0.3)', padding: '2px 8px', borderRadius: 20 }}>active</span>
              : <button style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--text-muted)', background: 'none', border: '1px solid var(--border)', borderRadius: 5, padding: '4px 10px', cursor: 'pointer' }}>activate</button>
            }
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "cyan",
  "cardColumns": 3,
  "showSalary": true,
  "showStats": true,
  "loading": false,
  "cardRadius": 10
}/*EDITMODE-END*/;

function App() {
  const { TweaksPanel, TweakSection, TweakRadio, TweakToggle, TweakSlider, useTweaks } = window;
  const [tweaks, setTweaks] = useTweaks(TWEAK_DEFAULTS);
  const [activePage, setActivePage] = useState('Today');
  const [filters, setFilters] = useState({
    search: '', func: 'Any function', vertical: 'Any vertical',
    seniority: 'Any seniority', location: 'Any location',
    minSalary: '', minRule: '', minMatch: '',
  });

  const filteredJobs = JOBS.filter(job => {
    if (filters.search) {
      const q = filters.search.toLowerCase();
      if (!job.title.toLowerCase().includes(q) && !job.company.toLowerCase().includes(q)) return false;
    }
    if (filters.func !== 'Any function' && job.func !== filters.func) return false;
    if (filters.vertical !== 'Any vertical' && job.vertical !== filters.vertical) return false;
    if (filters.location !== 'Any location') {
      if (filters.location === 'Remote' && !job.location.toLowerCase().includes('remote')) return false;
    }
    if (filters.minRule && job.ruleScore < parseInt(filters.minRule)) return false;
    if (filters.minMatch && (job.match === null || job.match < parseInt(filters.minMatch))) return false;
    return true;
  });

  const cols = tweaks.cardColumns;

  const pageContent = () => {
    if (activePage === 'Apply') return <ApplyPage />;
    if (activePage === 'Settings') return <SettingsPage />;
    if (activePage === 'Tune') return <TunePage />;
    if (activePage === 'CV') return <CVPage />;
    if (['Week', 'Archive'].includes(activePage)) return (
      <div style={{ padding: '80px 24px', textAlign: 'center' }}>
        <p style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--text-muted)' }}>{activePage.toLowerCase()} · coming soon</p>
      </div>
    );

    // Today page
    return (
      <div style={{ padding: '32px 24px', maxWidth: 1400, margin: '0 auto' }}>
        <PageHeader jobCount={JOBS.length} />
        {tweaks.showStats && <StatsRow jobs={JOBS} />}
        <FilterBar filters={filters} setFilters={setFilters} />
        <div style={{ display: 'grid', gridTemplateColumns: `repeat(${cols}, 1fr)`, gap: 14 }}>
          {tweaks.loading
            ? Array.from({ length: 6 }).map((_, i) => <SkeletonCard key={i} />)
            : filteredJobs.length > 0
              ? filteredJobs.map(job => (
                  <JobCard
                    key={job.id}
                    job={tweaks.showSalary ? job : { ...job, salary: null }}
                    accentColor={tweaks.accentColor}
                    cardRadius={tweaks.cardRadius}
                  />
                ))
              : <EmptyState />
          }
        </div>
      </div>
    );
  };

  return (
    <>
      <NavBar activePage={activePage} setActivePage={setActivePage} />
      <div className="main-scroll">
        {pageContent()}
      </div>
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks}>
        <TweakSection title="Accent Color">
          <TweakRadio id="accentColor" options={["cyan", "amber"]} tweaks={tweaks} setTweaks={setTweaks} />
        </TweakSection>
        <TweakSection title="Grid Columns">
          <TweakSlider id="cardColumns" min={1} max={4} step={1} tweaks={tweaks} setTweaks={setTweaks} />
        </TweakSection>
        <TweakSection title="Card Radius">
          <TweakSlider id="cardRadius" min={0} max={20} step={2} tweaks={tweaks} setTweaks={setTweaks} />
        </TweakSection>
        <TweakSection title="Display">
          <TweakToggle id="showSalary" label="Show salary" tweaks={tweaks} setTweaks={setTweaks} />
          <TweakToggle id="showStats" label="Show stats bar" tweaks={tweaks} setTweaks={setTweaks} />
          <TweakToggle id="loading" label="Show skeleton state" tweaks={tweaks} setTweaks={setTweaks} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
